<!DOCTYPE html>
<html>
    <head>
        <title>ntcd_lol - programmer</title>
        <link rel="stylesheet" href="static/style.css">
    </head>
    <body>
        <header class="top-menu">
            <div class="me">
                <img src="https://avatars.githubusercontent.com/u/198263185?v=4" alt="ntcd_lol avatar">
                <h2>ntcd_lol.</h2>
            </div>
            <nav>
                <ul>
                    <li><a href="https://ntcd-lol.github.io/">main();</a></li>
                    <li><a href="https://ntcd-lol.github.io/docs/">docs();</a></li>
                    <li><a href="https://ntcd-lol.github.io/question/">question();</a></li>
                </ul>
            </nav>
        </header>

        <div class="container">
            <h1>ntcd_lol</h1>
            <div class="accent-line"></div>
            <h2>Who am I?</h2>
            <div class="block">
                <p>I'm C++/Python programmer (And more other languages), and I'm 13 y.o. I love music, ARGs, and puzzles. :P</p><br>
                <p><strong>My projects:</strong></p><br>

                <!-- Сюда динамически рендерятся проекты -->
                <div id="projects-container">
                    <p id="projects-loading">Loading projects...</p>
                </div>

                <!-- Блок отображения последнего коммита -->
                <div id="commit-container">
                    <div style="display: inline-flex; gap: 10px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-github" viewBox="0 0 16 16">
                            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
                        </svg>
                        <p class="commit-title"> Last GitHub commit activity:</p>
                    </div>
                    <div id="commit-info" class="commit-details">Loading...</div>
                    <div id="commit-meta" class="commit-meta"></div>
                </div>
            </div>
        </div>

        <script>
        // ---------- Динамическая загрузка проектов из TOML (gist) ----------
        const PROJECTS_TOML_URL =
            'https://gist.githubusercontent.com/ntcd-lol/a059a291a937e4c6cc69dd77a337c65f/raw/data.toml';

        // Минимальный парсер TOML под формат [[projects]] с плоскими ключами
        function parseProjectsToml(text) {
            const projects = [];
            let current = null;

            const lines = text.split(/\r?\n/);
            for (let rawLine of lines) {
                // убрать комментарии (не внутри строк — для нашего простого формата достаточно)
                const line = rawLine.replace(/#.*$/, '').trim();
                if (!line) continue;

                if (line === '[[projects]]') {
                    if (current) projects.push(current);
                    current = {};
                    continue;
                }

                const eq = line.indexOf('=');
                if (eq === -1 || !current) continue;

                const key = line.slice(0, eq).trim();
                let value = line.slice(eq + 1).trim();

                // строковое значение
                if (value.startsWith('"') && value.endsWith('"')) {
                    value = value.slice(1, -1)
                        .replace(/\\"/g, '"')
                        .replace(/\\\\/g, '\\');
                }

                current[key] = value;
            }
            if (current) projects.push(current);
            return projects;
        }

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderProjects(projects) {
            const container = document.getElementById('projects-container');
            container.innerHTML = '';

            if (!projects.length) {
                container.innerHTML = '<p>Projects not found.</p>';
                return;
            }

            for (const p of projects) {
                const card = document.createElement('div');
                card.className = 'project';

                const img = document.createElement('img');
                img.src = p.icon || '';
                img.alt = (p.name || 'project') + ' logo';
                img.style.maxBlockSize = '10cap';
                img.style.borderRadius = '50%';
                img.loading = 'lazy';

                const info = document.createElement('div');
                const title = document.createElement('h2');
                title.textContent = p.name || 'Untitled';
                const desc = document.createElement('p');
                desc.textContent = p.description || '';
                info.appendChild(title);
                info.appendChild(desc);

                card.appendChild(img);
                card.appendChild(info);
                container.appendChild(card);
            }
        }

        async function loadProjects() {
            const container = document.getElementById('projects-container');
            try {
                const res = await fetch(PROJECTS_TOML_URL, { cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const text = await res.text();
                const projects = parseProjectsToml(text);
                renderProjects(projects);
            } catch (err) {
                console.error('Failed to load projects:', err);
                container.innerHTML = '<p>Cannot load projects.</p>';
            }
        }

        // ---------- Последний коммит (без изменений) ----------
        async function fetchLatestCommit() {
            const infoElement = document.getElementById('commit-info');
            const metaElement = document.getElementById('commit-meta');

            try {
                const reposResponse = await fetch(`https://api.github.com/users/ntcd-lol/repos?sort=pushed&per_page=1`);
                if (!reposResponse.ok) throw new Error(`Error: ${reposResponse.status}`);

                const repos = await reposResponse.json();
                if (!repos || repos.length === 0) {
                    infoElement.textContent = 'Commits not found.';
                    return;
                }

                const latestRepo = repos[0];
                const repoName = latestRepo.full_name;
                const defaultBranch = latestRepo.default_branch;

                const commitResponse = await fetch(`https://api.github.com/repos/` + repoName + `/commits?sha=${defaultBranch}&per_page=1`);
                if (!commitResponse.ok) throw new Error(`Error: ${commitResponse.status}`);

                const commits = await commitResponse.json();

                if (commits && commits.length > 0) {
                    const lastCommit = commits[0];
                    const shortSha = lastCommit.sha.substring(0, 7);
                    const commitMessage = lastCommit.commit.message;
                    const commitUrl = lastCommit.html_url;

                    infoElement.innerHTML = `<strong>[${shortSha}]</strong> ${escapeHtml(commitMessage)}`;
                    metaElement.innerHTML = `In repo: <a href="https://github.com/${repoName}" target="_blank">${repoName}</a> | <a href="${commitUrl}" target="_blank">Open commit.</a>`;
                } else {
                    infoElement.textContent = 'Коммиты не найдены.';
                }
            } catch (error) {
                console.error(error);
                infoElement.textContent = 'Cannot to load latest commit.';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadProjects();
            fetchLatestCommit();
        });
        </script>
    </body>
</html>
