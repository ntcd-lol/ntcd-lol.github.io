<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pse-lua — docs</title>
  <style>
    :root {
      --bg-body: #faf9f6;
      --bg-card: #ffffff;
      --bg-commit-block: #fdfdfd;
      --bg-commit-details: #f4f4f2;
      --color-main: #1e1e1e;
      --color-muted: #555555;
      --color-accent: #8b8b8b;
      --color-meta: #777777;
      --border-card: #ecece8;
      --border-menu: #e0e0e0;
      --border-commit: #cfcfcd;
      --shadow: 0 12px 28px rgba(0, 0, 0, 0.03), 0 4px 12px rgba(0, 0, 0, 0.02);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-body: #121212;
        --bg-card: #1e1e1e;
        --bg-commit-block: #181818;
        --bg-commit-details: #252525;
        --color-main: #e0e0e0;
        --color-muted: #aaaaaa;
        --color-accent: #555555;
        --color-meta: #888888;
        --border-card: #2a2a28;
        --border-menu: #2d2d2d;
        --border-commit: #444442;
        --shadow: 0 12px 28px rgba(0, 0, 0, 0.2), 0 4px 12px rgba(0, 0, 0, 0.15);
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-body);
      font-family: 'SF Mono', 'Menlo', 'Monaco', 'Cascadia Code', 'Roboto Mono', monospace;
      padding: 6rem 1.5rem 2rem 1.5rem;
      line-height: 1.6;
      color: var(--color-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    a { color: var(--color-main); text-decoration: underline; text-underline-offset: 3px; }
    a:hover { color: var(--color-muted); text-decoration-color: transparent; }

    .top-menu {
      position: fixed; top: 0; left: 0; width: 100%;
      background: var(--bg-card); border-bottom: 1px solid var(--border-menu);
      z-index: 1000; display: flex; align-items: center; justify-content: space-between;
      padding: 0.5rem 2rem;
    }
    .top-menu .me { display: flex; align-items: center; gap: 1rem; }
    .top-menu img { border-radius: 50%; width: 50px; height: 50px; object-fit: cover; }
    .top-menu h2 { margin: 0; font-size: 1.2rem; }
    .top-menu ul { list-style: none; display: flex; gap: 1rem; }
    .top-menu a { display: block; padding: 0.5rem 1rem; text-decoration: none; font-size: 0.9rem; }

    .container {
      max-width: 900px; width: 100%;
      background: var(--bg-card); padding: 3rem 2.5rem;
      border-radius: 28px; box-shadow: var(--shadow);
      border: 1px solid var(--border-card);
    }
    .accent-line {
      width: 75%; height: 4px; background: var(--color-accent);
      margin: 1rem auto 2rem auto; border-radius: 4px;
    }
    h1 { text-align: center; }
    .section {
      margin-bottom: 3rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px dashed var(--border-commit);
    }
    .section:last-child { border-bottom: none; }
    .section-title {
      font-size: 1.5rem; margin-bottom: 1rem;
      color: var(--color-main);
      border-left: 4px solid var(--color-accent);
      padding-left: 1rem;
    }
    .block-prose {
      margin: 1rem 0; color: var(--color-muted);
      white-space: pre-wrap; word-break: break-word;
    }
    .block-heading { margin: 1.5rem 0 0.75rem 0; font-weight: bold; }
    .block-heading[data-level="1"] { font-size: 1.8rem; }
    .block-heading[data-level="2"] { font-size: 1.4rem; }
    .block-heading[data-level="3"] { font-size: 1.2rem; }
    .block-code {
      margin: 1rem 0;
      background: var(--bg-commit-details);
      border-radius: 12px;
      border: 1px solid var(--border-commit);
      overflow: hidden;
    }
    .block-code-header {
      padding: 0.4rem 1rem;
      background: var(--bg-commit-block);
      border-bottom: 1px solid var(--border-commit);
      font-size: 0.8rem;
      color: var(--color-meta);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .block-code pre {
      margin: 0; padding: 1rem 1.2rem;
      overflow-x: auto;
      font-size: 0.9rem;
      line-height: 1.5;
      color: var(--color-main);
    }
    .block-code code { font-family: inherit; }
    .loading { text-align: center; color: var(--color-muted); padding: 2rem; }
  </style>
</head>
<body>
  <header class="top-menu">
    <div class="me">
      <img src="https://avatars.githubusercontent.com/u/198263185?v=4" alt="ntcd_lol avatar">
      <h2>ntcd_lol.</h2>
    </div>
    <nav>
      <ul>
        <li><a href="https://ntcd-lol.github.io/">main();</a></li>
        <li><a href="https://ntcd-lol.github.io/docs/">docs();</a></li>
        <li><a href="https://ntcd-lol.github.io/question/">question();</a></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <h1>pse-lua</h1>
    <div class="accent-line"></div>
    <div id="app"><p class="loading">Loading manifest...</p></div>
  </div>

  <script>
    async function loadManifest() {
      const app = document.getElementById('app');
      try {
        const res = await fetch('./manifest.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const manifest = await res.json();
        render(manifest);
      } catch (e) {
        app.innerHTML = '<p class="loading">Failed to load manifest.json</p>';
        console.error(e);
      }
    }

    function render(manifest) {
      const app = document.getElementById('app');
      app.innerHTML = '';

      for (const section of manifest.sections) {
        const secEl = document.createElement('div');
        secEl.className = 'section';

        const title = document.createElement('h2');
        title.className = 'section-title';
        title.textContent = section.title;
        secEl.appendChild(title);

        for (const block of section.blocks) {
          if (block.type === 'heading') {
            const h = document.createElement('div');
            h.className = 'block-heading';
            h.dataset.level = block.level;
            h.textContent = block.content;
            secEl.appendChild(h);
          } else if (block.type === 'prose') {
            const p = document.createElement('div');
            p.className = 'block-prose';
            p.textContent = block.content;
            secEl.appendChild(p);
          } else if (block.type === 'code') {
            const wrap = document.createElement('div');
            wrap.className = 'block-code';
            if (block.language) {
              const header = document.createElement('div');
              header.className = 'block-code-header';
              header.textContent = block.language;
              wrap.appendChild(header);
            }
            const pre = document.createElement('pre');
            const code = document.createElement('code');
            code.textContent = block.content;
            pre.appendChild(code);
            wrap.appendChild(pre);
            secEl.appendChild(wrap);
          }
        }
        app.appendChild(secEl);
      }
    }

    document.addEventListener('DOMContentLoaded', loadManifest);
  </script>
</body>
</html>
